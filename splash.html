<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lampa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1d1f20;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .welcome {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1d1f20 url('welcome.jpg') no-repeat 50% 50%;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 脉冲动画 - 轻微的呼吸效果 */
    .logo-container {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.85;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    /* 加载提示（可选，默认隐藏） */
    .loading-text {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 0.5s ease-in 0.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="welcome">
    <div class="logo-container">
      <!-- Lampa 的同心圆 logo 已经在 welcome.jpg 背景图中 -->
    </div>
    <!-- <div class="loading-text">LOADING</div> -->
  </div>

  <script>
    // 1 秒后跳转到 lampa.mx
    setTimeout(() => {
      window.location.href = 'http://lampa.mx';
    }, 1000);

    // 可选：检测网络连接
    // fetch('http://lampa.mx', {method: 'HEAD', mode: 'no-cors'})
    //   .then(() => {
    //     setTimeout(() => window.location.href = 'http://lampa.mx', 800);
    //   })
    //   .catch(() => {
    //     document.querySelector('.loading-text').textContent = 'CONNECTION ERROR';
    //   });
  </script>
</body>
</html>
