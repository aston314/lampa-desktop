name: Build Lampa Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Clone and build webframe
        run: |
          git clone https://github.com/tractordev/webframe.git
          cd webframe
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o webframe ./cmd/webframe
          mkdir -p ~/go/bin
          mv webframe ~/go/bin/

      - name: Clone Lampa source
        run: |
          git clone https://github.com/yumata/lampa.git lampa-source

      - name: Verify icon
        run: |
          # Icon already exists in root
          ls -lh lampa.icns

      - name: Build Lampa-Local.app
        run: |
          mkdir -p Lampa-Local.app/Contents/{MacOS,Resources}

          # Copy webframe binary
          cp ~/go/bin/webframe Lampa-Local.app/Contents/MacOS/
          chmod +x Lampa-Local.app/Contents/MacOS/webframe

          # Copy Lampa source
          cp -r lampa-source/* Lampa-Local.app/Contents/Resources/

          # Copy icon
          cp lampa.icns Lampa-Local.app/Contents/Resources/

          # Create launch script
          cat > Lampa-Local.app/Contents/MacOS/Lampa << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          RESOURCES="$DIR/../Resources"
          exec "$DIR/webframe" -d -w 1280x720 "file://$RESOURCES/index.html"
          EOF
          chmod +x Lampa-Local.app/Contents/MacOS/Lampa

          # Create Info.plist
          cat > Lampa-Local.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Lampa</string>
            <key>CFBundleExecutable</key>
            <string>Lampa</string>
            <key>CFBundleIconFile</key>
            <string>lampa.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.lampa.app</string>
            <key>CFBundleName</key>
            <string>Lampa</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.get_version.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.get_version.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build Lampa-Online.app
        run: |
          mkdir -p Lampa-Online.app/Contents/{MacOS,Resources}

          # Copy webframe binary
          cp ~/go/bin/webframe Lampa-Online.app/Contents/MacOS/
          chmod +x Lampa-Online.app/Contents/MacOS/webframe

          # Copy icon
          cp lampa.icns Lampa-Online.app/Contents/Resources/

          # Copy splash page and welcome image
          cp splash.html Lampa-Online.app/Contents/Resources/
          cp welcome.jpg Lampa-Online.app/Contents/Resources/

          # Create launch script
          cat > Lampa-Online.app/Contents/MacOS/Lampa << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          RESOURCES="$DIR/../Resources"
          exec "$DIR/webframe" -d -w 1280x720 "file://$RESOURCES/splash.html"
          EOF
          chmod +x Lampa-Online.app/Contents/MacOS/Lampa

          # Create Info.plist with ATS exception
          cat > Lampa-Online.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Lampa Online</string>
            <key>CFBundleExecutable</key>
            <string>Lampa</string>
            <key>CFBundleIconFile</key>
            <string>lampa.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.lampa.online</string>
            <key>CFBundleName</key>
            <string>Lampa Online</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.get_version.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.get_version.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Sign and package apps
        run: |
          # Ad-hoc sign the apps (no certificate needed)
          codesign --force --deep --sign - Lampa-Local.app
          codesign --force --deep --sign - Lampa-Online.app

          # Verify signatures
          codesign -dv Lampa-Local.app
          codesign -dv Lampa-Online.app

          # Remove extended attributes (quarantine flags)
          xattr -cr Lampa-Local.app
          xattr -cr Lampa-Online.app

          # Package Local version
          hdiutil create -volname "Lampa Local" -srcfolder Lampa-Local.app -ov -format UDZO Lampa-Local-macOS.dmg

          # Package Online version
          hdiutil create -volname "Lampa Online" -srcfolder Lampa-Online.app -ov -format UDZO Lampa-Online-macOS.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-apps
          path: |
            Lampa-Local-macOS.dmg
            Lampa-Online-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone and build webframe
        shell: pwsh
        run: |
          git clone https://github.com/tractordev/webframe.git
          cd webframe
          go build -o webframe.exe
          $gobin = "$env:GOPATH\bin"
          if (-not (Test-Path $gobin)) { New-Item -ItemType Directory -Force -Path $gobin }
          Copy-Item webframe.exe -Destination "$gobin\"
          echo "$gobin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clone Lampa source
        run: git clone https://github.com/yumata/lampa.git lampa-source

      - name: Build Lampa-Local (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Lampa-Local-Windows/Resources

          # Copy webframe
          Copy-Item "$env:GOPATH\bin\webframe.exe" -Destination Lampa-Local-Windows/

          # Copy Lampa source
          Copy-Item -Recurse lampa-source/* -Destination Lampa-Local-Windows/Resources/

          # Copy icon
          Copy-Item lampa-source/icons/android-chrome-384x384.png -Destination Lampa-Local-Windows/lampa.png

          # Create launch script
          @"
          @echo off
          set DIR=%~dp0
          "%DIR%webframe.exe" -d -w 1280x720 "file:///%DIR%Resources/index.html"
          "@ | Out-File -FilePath Lampa-Local-Windows/Lampa.bat -Encoding ASCII

      - name: Build Lampa-Online (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Lampa-Online-Windows/Resources

          # Copy webframe
          Copy-Item "$env:GOPATH\bin\webframe.exe" -Destination Lampa-Online-Windows/

          # Copy icon
          Copy-Item lampa-source/icons/android-chrome-384x384.png -Destination Lampa-Online-Windows/lampa.png

          # Copy splash page and welcome image
          Copy-Item splash.html -Destination Lampa-Online-Windows/Resources/
          Copy-Item welcome.jpg -Destination Lampa-Online-Windows/Resources/

          # Create launch script
          @"
          @echo off
          set DIR=%~dp0
          "%DIR%webframe.exe" -d -w 1280x720 "file:///%DIR%Resources/splash.html"
          "@ | Out-File -FilePath Lampa-Online-Windows/Lampa.bat -Encoding ASCII

      - name: Create ZIP packages
        shell: pwsh
        run: |
          Compress-Archive -Path Lampa-Local-Windows/* -DestinationPath Lampa-Local-Windows.zip
          Compress-Archive -Path Lampa-Online-Windows/* -DestinationPath Lampa-Online-Windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-apps
          path: |
            Lampa-Local-Windows.zip
            Lampa-Online-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file libfuse2 libwebkit2gtk-4.1-dev

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Clone and build webframe
        run: |
          git clone https://github.com/tractordev/webframe.git
          cd webframe
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o webframe ./cmd/webframe
          mkdir -p ~/go/bin
          mv webframe ~/go/bin/

      - name: Clone Lampa source
        run: git clone https://github.com/yumata/lampa.git lampa-source

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build Lampa-Local AppImage
        run: |
          mkdir -p Lampa-Local.AppDir/usr/{bin,share/applications,share/icons/hicolor/256x256/apps}

          # Copy webframe
          cp ~/go/bin/webframe Lampa-Local.AppDir/usr/bin/
          chmod +x Lampa-Local.AppDir/usr/bin/webframe

          # Copy Lampa source
          cp -r lampa-source Lampa-Local.AppDir/usr/share/lampa

          # Copy icon
          cp lampa-source/icons/android-chrome-384x384.png Lampa-Local.AppDir/usr/share/icons/hicolor/256x256/apps/lampa.png
          cp lampa-source/icons/android-chrome-384x384.png Lampa-Local.AppDir/lampa.png

          # Create desktop file
          cat > Lampa-Local.AppDir/lampa.desktop << 'EOF'
          [Desktop Entry]
          Name=Lampa
          Exec=lampa
          Icon=lampa
          Type=Application
          Categories=AudioVideo;Video;
          Comment=Lampa media player
          EOF

          # Create AppRun script
          cat > Lampa-Local.AppDir/AppRun << 'EOF'
          #!/bin/bash
          DIR="$(dirname "$(readlink -f "${0}")")"
          exec "$DIR/usr/bin/webframe" -d -w 1280x720 "file://$DIR/usr/share/lampa/index.html"
          EOF
          chmod +x Lampa-Local.AppDir/AppRun

          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage Lampa-Local.AppDir Lampa-Local-Linux-x86_64.AppImage

      - name: Build Lampa-Online AppImage
        run: |
          mkdir -p Lampa-Online.AppDir/usr/{bin,share/applications,share/icons/hicolor/256x256/apps,share/lampa}

          # Copy webframe
          cp ~/go/bin/webframe Lampa-Online.AppDir/usr/bin/
          chmod +x Lampa-Online.AppDir/usr/bin/webframe

          # Copy icon
          cp lampa-source/icons/android-chrome-384x384.png Lampa-Online.AppDir/usr/share/icons/hicolor/256x256/apps/lampa.png
          cp lampa-source/icons/android-chrome-384x384.png Lampa-Online.AppDir/lampa.png

          # Copy splash page and welcome image
          cp splash.html Lampa-Online.AppDir/usr/share/lampa/
          cp welcome.jpg Lampa-Online.AppDir/usr/share/lampa/

          # Create desktop file
          cat > Lampa-Online.AppDir/lampa-online.desktop << 'EOF'
          [Desktop Entry]
          Name=Lampa Online
          Exec=lampa-online
          Icon=lampa
          Type=Application
          Categories=AudioVideo;Video;
          Comment=Lampa media player (online)
          EOF

          # Create AppRun script
          cat > Lampa-Online.AppDir/AppRun << 'EOF'
          #!/bin/bash
          DIR="$(dirname "$(readlink -f "${0}")")"
          exec "$DIR/usr/bin/webframe" -d -w 1280x720 "file://$DIR/usr/share/lampa/splash.html"
          EOF
          chmod +x Lampa-Online.AppDir/AppRun

          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage Lampa-Online.AppDir Lampa-Online-Linux-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-apps
          path: |
            Lampa-Local-Linux-x86_64.AppImage
            Lampa-Online-Linux-x86_64.AppImage

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

